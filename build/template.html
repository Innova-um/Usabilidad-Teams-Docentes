<title>Uso de Teams Docentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap">
<style>
:root{
  color-scheme:light;
  /* Identidad Universidad del Magdalena */
  --brand:#004A87; --brand-700:#003A6B; --brand-900:#00294B; --brand-50:#EAF1F8; --gold:#D17900;
  --page:#F2F5F9; --surface:#FFFFFF; --surface-2:#F6F9FC;
  --ink:#0E2238; --ink-2:#4A5A6E; --muted:#7A8799;
  --grid:#E3E9F0; --line:#CFD8E3; --ring:rgba(0,41,75,.10);
  /* Nivel de uso: una sola tonalidad, de más a menos intensidad */
  --l4:#00294B; --l3:#1F64B0; --l2:#6E9BD1; --l1:#B7CDE8; --l0:#D3DAE3;
  /* Series (validadas para daltonismo) */
  --k0:#1F64B0; --k1:#D17900; --k2:#7B5CC4; --none:#D3DAE3;
  --focus:#D17900;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font:14px/1.5 "Instrument Sans",system-ui,"Segoe UI",sans-serif;padding-inline:16px;padding-block:24px 48px;margin:0}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:"Montserrat","Instrument Sans",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.head{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-700) 60%,var(--brand-900) 100%);
  color:#fff;border-radius:16px;padding:26px 26px 22px;border-bottom:5px solid var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#FFC766;font-weight:600}
h1{font-weight:700;font-size:clamp(26px,3.8vw,38px);line-height:1.1;letter-spacing:-.015em;margin-top:4px}
.lede{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:14px}

/* Filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);padding-block:10px;display:grid;gap:10px}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0;flex:1 1 200px}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
select:disabled{opacity:.55}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.crumbs button{border:0;background:none;padding:2px 4px;border-radius:4px;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.crumbs .sep{color:var(--muted)}
.crumbs .cur{font-weight:600;color:var(--brand)}
.btn{border:1px solid var(--brand);color:var(--brand);font-weight:600;background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px;flex:none}


/* Fila superior: total + conexión */
.top{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:12px}
.top .kpi{border-left:5px solid var(--brand);gap:8px;align-content:center}
.top .kpi .val{font-size:40px}
.top .kpi .btn{justify-self:start;margin-top:4px}
@media (max-width:760px){ .top{grid-template-columns:1fr} }
/* Rango de conexión */
.rng{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px;display:grid;gap:14px}
.rtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rtab{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:14px 16px;display:grid;gap:2px;background:var(--surface)}
.rtab:hover{background:var(--brand-50)}
.rtab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.rtab[aria-pressed="true"]{background:var(--brand-50);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.rtab small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rtab b{font-size:28px;line-height:1.1;color:var(--brand-900)}
.rtab span{font-size:12.5px;color:var(--ink-2)}
.days{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2)}
.days b{color:var(--ink)}
.warn{font-size:12.5px;color:var(--ink-2);background:#FFF5E6;border:1px solid #F2D3A6;border-radius:8px;padding:8px 12px;margin:0}

/* KPI tiles */
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;display:grid;gap:4px;align-content:start}
.kpi h3{font-size:12px;font-weight:700;color:var(--brand-700);letter-spacing:.02em}
.kpi .val{font-size:30px;font-weight:700;color:var(--brand-900);line-height:1.1;letter-spacing:-.01em}
.kpi .sub{font-size:12.5px;color:var(--ink-2)}

/* Panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:baseline}
.ph h2{font-size:17px;font-weight:700;color:var(--brand-900)}
.ph p{margin:0;font-size:12.5px;color:var(--ink-2);max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
.hatch{background-image:repeating-linear-gradient(45deg,rgba(0,41,75,.28) 0 1px,transparent 1px 5px)}

.hint{font-size:12px;color:var(--muted);margin:0}


/* Table */
#tMain{min-width:0}
.tblwrap{overflow-x:auto;border:1px solid var(--grid);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1000px;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:top}
#tMain thead tr.grow th{position:static;text-align:center;font-size:10.5px;letter-spacing:.05em;padding:6px 10px;border-bottom:0}
#tMain th.g0{background:var(--surface)}
#tMain th.gh{background:var(--brand);color:#fff;border-radius:8px 8px 0 0}
#tMain td.acc{display:none}
.accnote{margin:0;font-size:12.5px;color:var(--ink-2);background:var(--brand-50);border-left:4px solid var(--brand);border-radius:6px;padding:8px 12px}
.accnote b{color:var(--brand-900)}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-700);font-weight:700;background:var(--brand-50);position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
th .ar{color:var(--ink);font-size:10px}
td.r,th.r{text-align:right}
th.r button{justify-content:flex-end}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--brand-50)}
.cn{font-weight:500}
#tMain td:first-child{min-width:240px}
.cs{font-size:11.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-2)}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}

/* Tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--brand-900);color:#fff;border-top:3px solid var(--gold);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip b{display:block;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){ .br i{transition:width .35s ease} }
/* Orden en pantallas pequeñas (la tabla pasa a tarjetas) */
.msort{display:none}
.pb{display:flex;gap:6px}

/* Tabletas y teléfonos: la tabla se muestra como tarjetas */
@media (max-width:900px){
  .filters{position:static}
  .top{grid-template-columns:1fr}
  .top .kpi{grid-template-columns:auto 1fr;align-items:center;column-gap:16px}
  .top .kpi h3{grid-column:1/-1}
  .top .kpi .val{grid-row:span 2}
  .top .kpi .btn{grid-column:1/-1}
  .msort{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
  .msort{flex-wrap:nowrap}
  .msort label{display:grid;gap:4px;flex:1 1 0;min-width:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .msort select{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:14px}
  .msort .md{flex:0 0 auto;min-height:44px}
  .tblwrap{overflow:visible;border:0;border-radius:0}
  #tMain table{min-width:0;display:block}
  #tMain thead{display:none}
  #tMain tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
  #tMain tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px;background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px}
  #tMain td{display:grid;gap:1px;align-content:start;padding:0;border:0;text-align:left;min-width:0;font-size:14px}
  #tMain td::before{content:attr(data-label);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.25}
  #tMain td.who{grid-column:1/-1;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--grid)}
  #tMain td.who::before,#tMain td.empty::before,#tMain td.acc::before{display:none}
  #tMain td.acc{display:block;grid-column:1/-1;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--brand-700);background:var(--brand-50);border-radius:6px;padding:5px 8px;margin-top:2px}
  #tMain td.who .cn{font-size:15px}
  #tMain td.st .tag{white-space:normal}
  #tMain td.empty{grid-column:1/-1}
  #tMain tbody tr:hover td{background:none}
  .pager{justify-content:center;text-align:center}
  .pager .pi{flex:1 1 100%}
  .pb{flex:1 1 100%}
  .pb button{flex:1;min-height:44px;font-weight:600}
}

/* Teléfonos */
@media (max-width:560px){
  body{padding-block:16px 32px}
  .wrap{gap:14px}
  .head{padding:20px 18px 18px;border-radius:14px}
  .lede{font-size:13px}
  .field{flex-basis:100%}
  .filters .btn{width:100%}
  select,input[type=search]{font-size:16px;min-height:44px}
  .rng,.panel{padding:14px}
  .rtabs{grid-template-columns:1fr 1fr;gap:8px}
  .rtab{padding:12px}
  .rtab b{font-size:24px}
  .rtab span{font-size:12px}
  .top .kpi .val{font-size:34px}
  .ph .btn{width:100%}
}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <div class="eyebrow">Universidad del Magdalena · Microsoft Teams</div>
      <h1>Uso de Teams Docentes</h1>
      <p class="lede">Usuarios con rol de profesor · Informe de actividad de Microsoft 365</p>
    </div>
  </header>

  <section class="filters" aria-label="Filtros">
    <div class="frow">
      <div class="field"><label for="fRng">Conexión <span id="lRng"></span></label><select id="fRng"></select></div>
      <div class="field"><label for="fLvl">Nivel de uso</label><select id="fLvl"></select></div>
      <div class="field"><label for="fQ">Buscar docente</label><input id="fQ" type="search" placeholder="Nombre o usuario" autocomplete="off"></div>
      <button type="button" class="btn" id="reset">Limpiar filtros</button>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Nivel actual"></nav>
  </section>

  <section class="top">
    <article class="kpi" id="kpi" aria-live="polite"></article>
    <div class="rng" aria-labelledby="tRng">
      <div class="ph"><div><h2 id="tRng"></h2><p>Elige un grupo y todo el tablero muestra solo esos profesores. Se decide con la fecha de su última actividad en Teams.</p></div></div>
      <div class="rtabs" id="rtabs"></div>
      <div class="days" id="days"></div>
      <p class="warn" id="rwarn"></p>
    </div>
  </section>

  <section class="panel">
    <div class="ph">
      <div><h2>Detalle por profesor</h2><p id="sDet"></p></div>
      <button type="button" class="btn" id="csv">Descargar CSV</button>
    </div>
    <p class="accnote" id="sAcc"></p>
    <div id="tMain"></div>
  </section>

</div>
<div id="tip" hidden></div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const fmt = (n, dec=0) => Number(n).toLocaleString('es-CO', {minimumFractionDigits:dec, maximumFractionDigits:dec});
const pct = (a, b) => b ? a/b*100 : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const hrs = s => s/3600;
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const dt = iso => { if(!iso) return 'Sin registro'; const [y,m,d] = iso.split('-'); return `${+d} ${MES[+m-1]} ${y}`; };
const day = iso => Date.parse(iso+'T00:00:00Z')/864e5;
const REF = day(D.ref);

// Índices de las métricas (mismo orden que METRICAS en build_teams.py)
const M = { chatEq:0, chatPr:1, llam:2, reu:3, org:4, asi:5, impO:6, impA:7, uniO:8, uniA:9, perO:10, perA:11, aud:12, vid:13, pan:14, pub:15, resp:16, urg:17 };

// Niveles de uso (de mayor a menor)
const LV = [
  {k:4, name:'Intensivo', desc:'52 o más reuniones', c:'var(--l4)'},
  {k:3, name:'Frecuente', desc:'13 a 51 reuniones', c:'var(--l3)'},
  {k:2, name:'Ocasional', desc:'1 a 12 reuniones', c:'var(--l2)'},
  {k:1, name:'Sin reuniones', desc:'solo chat u otras acciones', c:'var(--l1)'},
  {k:0, name:'No usó Teams', desc:'sin ninguna actividad', c:'var(--l0)', hatch:true},
];
const LVk = Object.fromEntries(LV.map(l=>[l.k,l]));
const swL = l => `<i class="sw${l.hatch?' hatch':''}" style="background-color:${l.c}"></i>`;
const LIC = ['Office 365 A3 beneficio para estudiantes', 'Office 365 A3 para docentes'];

// Profesores con campos derivados
const T = D.t.map(([user, last, other, facLic, m, name]) => {
  const act = m.some(v=>v>0) || other===1 || (!!last && day(last) > REF - D.days);
  const lvl = !act ? 0 : m[M.reu]>=52 ? 4 : m[M.reu]>=13 ? 3 : m[M.reu]>=1 ? 2 : 1;
  name = name || user;
  return { user, name, last, facLic, m, act, lvl, ago: last ? REF - day(last) : null, key: norm(name+' '+user) };
});

const inR = t => !!t.last && t.last >= D.r0 && t.last <= D.r1;
T.forEach(t => t.inR = inR(t));
const RNG = { si:{c:'var(--k0)', lab:'Se conectaron'}, no:{c:'var(--k1)', lab:'No se conectaron'}, '':{c:'var(--line)', lab:'Todos los profesores'} };
const rangoTxt = `del ${dt(D.r0).replace(/ \d{4}$/,'')} al ${dt(D.r1)}`;
// Periodo que acumulan reuniones, horas, mensajes y llamadas
const ACC = `Acumulado de ${D.days} días · ${dt(D.ini)} al ${dt(D.ref)}`;
const S = { rng:'', lvl:'', q:'' };

// Filtros
$('#fLvl').innerHTML = '<option value="">Todos los niveles</option>' + LV.map(l=>`<option value="${l.k}">${l.name} (${l.desc})</option>`).join('');
$('#lRng').textContent = rangoTxt.replace(/ \d{4}$/,'');
$('#fRng').innerHTML = ['','si','no'].map(k=>`<option value="${k}">${k==='' ? 'Todos (usaron y no usaron)' : RNG[k].lab}</option>`).join('');
$('#fRng').value = S.rng;
function setRng(k){ S.rng = k; $('#fRng').value = k; render(); }
$('#fRng').onchange = e => setRng(e.target.value);
$('#fLvl').onchange = e => { S.lvl = e.target.value; render(); };
let qT; $('#fQ').oninput = e => { clearTimeout(qT); qT = setTimeout(()=>{ S.q = norm(e.target.value.trim()); render(); }, 180); };
$('#reset').onclick = ()=>{ S.q=''; $('#fQ').value=''; S.lvl=''; $('#fLvl').value=''; setRng(''); };

// Tooltip
const tip = $('#tip');
function showTip(e, html){ tip.innerHTML = html; tip.hidden = false; moveTip(e); }
function moveTip(e){ const r = tip.getBoundingClientRect(); let x = e.clientX+14, y = e.clientY+14; if(x+r.width > innerWidth-8) x = e.clientX-r.width-14; if(y+r.height > innerHeight-8) y = e.clientY-r.height-14; tip.style.left = Math.max(8,x)+'px'; tip.style.top = Math.max(8,y)+'px'; }
function hideTip(){ tip.hidden = true; }
function hover(el, html){ el.onmouseenter = e=>showTip(e, html); el.onmousemove = moveTip; el.onmouseleave = hideTip; }

function filtered(skipLvl){
  return T.filter(t => (S.rng==='' || t.inR===(S.rng==='si')) && (skipLvl || S.lvl==='' || t.lvl===+S.lvl) && (!S.q || t.key.includes(S.q)));
}
const sumM = (rows, k) => rows.reduce((s,t)=>s+t.m[k], 0);
const cntM = (rows, k) => rows.filter(t=>t.m[k]>0).length;



function renderKPI(F){
  const n = F.length;
  const vista = S.rng==='' ? 'con rol Profesor en el informe' : `${RNG[S.rng].lab.toLowerCase()} ${rangoTxt}`;
  $('#kpi').innerHTML = `<h3>Profesores analizados</h3><span class="val num">${fmt(n)}</span>`
    + `<span class="sub">${n===T.length ? vista : `${vista} · de ${fmt(T.length)} en total`}</span>`
    + (S.rng!=='' ? `<button type="button" class="btn" id="kAll">Ver los ${fmt(T.length)} profesores</button>` : '');
  const b = $('#kAll'); if(b) b.onclick = () => setRng('');
}

// Tablas de profesores (reutilizables)
const PAGE = 25;
const COLS = [
  ['name','Profesor',''], ['conn',`Teams ${rangoTxt.replace(/ \d{4}$/,'')}`,''], ['lvl','Nivel',''], ['ago','Última actividad',''],
  ['reu','Reuniones','r'], ['org','Organizó','r'], ['h','Horas conectado','r'], ['vid','Horas cámara','r'], ['pan','Horas pantalla','r'],
  ['msg','Mensajes chat','r'], ['can','Canales','r'], ['llam','Llamadas','r'],
];
const rowOf = t => ({ t, name:t.name, conn:t.inR?1:0, lvl:t.lvl, ago: t.ago===null ? 1e9 : t.ago,
  reu:t.m[M.reu], org:t.m[M.org], h:hrs(t.m[M.aud]), vid:hrs(t.m[M.vid]), pan:hrs(t.m[M.pan]), msg:t.m[M.chatPr]+t.m[M.chatEq], can:t.m[M.pub]+t.m[M.resp], llam:t.m[M.llam] });
function makeTable(host, sort, empty){
  host.innerHTML = `<div class="msort"><label>Ordenar por <select class="ms"></select></label><button type="button" class="md btn" aria-label="Cambiar sentido del orden"></button></div>
    <div class="tblwrap"><table><thead></thead><tbody></tbody></table></div>
    <div class="pager"><span class="pi"></span><span class="pb"><button type="button" class="pp">Anterior</button><button type="button" class="pn">Siguiente</button></span></div>`;
  const q = s => host.querySelector(s);
  const tb = { rows:[], sort, page:0 };
  const defDir = k => ['name','ago'].includes(k) ? 1 : -1;
  q('.pp').onclick = ()=>{ tb.page--; draw(); top(); };
  q('.pn').onclick = ()=>{ tb.page++; draw(); top(); };
  // En teléfonos, al cambiar de página se vuelve al inicio de la lista
  const top = () => { if(matchMedia('(max-width:900px)').matches) host.scrollIntoView({block:'start'}); };
  q('.ms').innerHTML = COLS.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('');
  q('.ms').onchange = e => { const k = e.target.value; tb.sort = [k, defDir(k)]; tb.page=0; draw(); };
  q('.md').onclick = () => { tb.sort = [tb.sort[0], -tb.sort[1]]; tb.page=0; draw(); };
  function draw(){
    const [sk, sd] = tb.sort, R = tb.rows;
    R.sort((a,b)=>{ const x=a[sk], y=b[sk]; return (typeof x==='string' ? x.localeCompare(y,'es') : (x===y?0:(x<y?-1:1))) * sd || b.h-a.h; });
    const nMet = COLS.length - 4;
    q('thead').innerHTML = `<tr class="grow"><th colspan="4" class="g0"></th><th colspan="${nMet}" class="gh">${esc(ACC)}</th></tr>` + '<tr>' + COLS.map(([k,l,c])=>`<th class="${c}" aria-sort="${sk===k?(sd>0?'ascending':'descending'):'none'}"><button type="button" data-k="${k}">${esc(l)}${sk===k?`<span class="ar">${sd>0?'▲':'▼'}</span>`:''}</button></th>`).join('') + '</tr>';
    q('thead').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ const k=b.dataset.k; tb.sort = [k, tb.sort[0]===k ? -tb.sort[1] : defDir(k)]; tb.page=0; draw(); });
    q('.ms').value = sk; q('.md').textContent = sd>0 ? '▲ Ascendente' : '▼ Descendente';
    const pages = Math.max(1, Math.ceil(R.length/PAGE)); tb.page = Math.min(Math.max(0,tb.page), pages-1);
    const slice = R.slice(tb.page*PAGE, tb.page*PAGE+PAGE);
    const L = Object.fromEntries(COLS.map(([k,l])=>[k,esc(l)]));
    const n = (k, v) => `<td class="r num" data-label="${L[k]}">${v}</td>`;
    q('tbody').innerHTML = slice.length ? slice.map(r=>{ const l = LVk[r.lvl]; return `<tr>
      <td class="who"><div class="cn">${esc(r.name)}</div><div class="cs">${esc(r.t.user)} · ${r.t.facLic?'licencia docente':'licencia estudiante'}</div></td>
      <td class="st" data-label="${L.conn}"><span class="tag"><i class="sw" style="background:${r.conn?'var(--k0)':'var(--k1)'}"></i>${r.conn?'Usó Teams':'No usó Teams'}</span></td>
      <td class="st" data-label="${L.lvl}"><span class="tag">${swL(l)}${l.name}</span></td>
      <td class="st" data-label="${L.ago}">${dt(r.t.last)}${r.t.ago!==null?`<div class="cs">hace ${fmt(r.t.ago)} días</div>`:''}</td>
      <td class="acc">${esc(ACC)}</td>
      ${n('reu',fmt(r.reu))}${n('org',fmt(r.org))}${n('h',fmt(r.h,1))}${n('vid',fmt(r.vid,1))}${n('pan',fmt(r.pan,1))}
      ${n('msg',fmt(r.msg))}${n('can',fmt(r.can))}${n('llam',fmt(r.llam))}</tr>`; }).join('')
      : `<tr><td colspan="${COLS.length}" class="hint empty">${empty}</td></tr>`;
    q('.pi').textContent = R.length ? `${fmt(tb.page*PAGE+1)}–${fmt(tb.page*PAGE+slice.length)} de ${fmt(R.length)} profesores` : '';
    q('.pp').disabled = tb.page<=0; q('.pn').disabled = tb.page>=pages-1;
  }
  tb.set = rows => { tb.rows = rows.map(rowOf); tb.page = 0; draw(); };
  return tb;
}
function downloadCSV(rows, name){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const h2 = s => hrs(s).toFixed(2).replace('.',',');
  const head = ['Nombre completo','Usuario',`Se conectó ${rangoTxt}`,'Licencia','Nivel de uso','Última actividad','Días desde la última actividad',`Reuniones (participó) - acumulado ${D.days} días`,`Reuniones organizadas - acumulado ${D.days} días`,`Reuniones asistidas - acumulado ${D.days} días`,`Reuniones programadas organizadas - acumulado ${D.days} días`,`Reuniones periódicas organizadas - acumulado ${D.days} días`,`Reuniones improvisadas organizadas - acumulado ${D.days} días`,`Horas conectado (audio) - acumulado ${D.days} días`,`Horas cámara (video) - acumulado ${D.days} días`,`Horas pantalla compartida - acumulado ${D.days} días`,`Mensajes chat privado - acumulado ${D.days} días`,`Mensajes chat de equipos - acumulado ${D.days} días`,`Publicaciones en canales - acumulado ${D.days} días`,`Respuestas en canales - acumulado ${D.days} días`,`Llamadas - acumulado ${D.days} días`];
  const lines = rows.map(({t})=>{ const m=t.m; return [t.name, t.user, t.inR?'Sí':'No', LIC[t.facLic], LVk[t.lvl].name, t.last, t.ago ?? '', m[M.reu], m[M.org], m[M.asi], m[M.uniO], m[M.perO], m[M.impO],
    h2(m[M.aud]), h2(m[M.vid]), h2(m[M.pan]), m[M.chatPr], m[M.chatEq], m[M.pub], m[M.resp], m[M.llam]].map(q).join(';'); });
  const blob = new Blob(['\ufeff'+[head.map(q).join(';'), ...lines].join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const TM = makeTable($('#tMain'), ['conn', -1], 'No hay resultados con los filtros actuales.');
$('#csv').onclick = ()=> downloadCSV(TM.rows, `uso_teams_profesores${S.rng==='si'?'_conectados':S.rng==='no'?'_no_conectados':''}_${D.r0}_a_${D.r1}.csv`);

function renderRange(){
  const base = T.filter(t => (!S.q || t.key.includes(S.q)));
  const n = base.length, si = base.filter(t=>t.inR).length;
  const cnt = { si, no:n-si, '':n };
  const sub = { si:`${fmt(pct(si,n),1)} % · su última actividad fue ${rangoTxt}`, no:`${fmt(pct(n-si,n),1)} % · sin actividad en Teams ${rangoTxt}`, '':'Sin filtrar por conexión' };
  $('#tRng').textContent = `Conexión a Teams ${rangoTxt}`;
  $('#rtabs').innerHTML = ['si','no'].map(k=>`<button type="button" class="rtab" style="--c:${RNG[k].c}" data-k="${k}" aria-pressed="${S.rng===k}"><small>${RNG[k].lab}</small><b class="num">${fmt(cnt[k])}</b><span>${sub[k]}</span></button>`).join('');
  $('#rtabs').querySelectorAll('button').forEach(b => b.onclick = () => setRng(S.rng===b.dataset.k ? '' : b.dataset.k));
  const byDay = {}; for(let d = day(D.r0); d <= day(D.r1); d++){ const iso = new Date(d*864e5).toISOString().slice(0,10); byDay[iso] = base.filter(t=>t.last===iso).length; }
  $('#days').innerHTML = '<span>Por día de última actividad:</span>' + Object.entries(byDay).map(([iso,c]) => `<span>${dt(iso).replace(/ \d{4}$/,'')}: <b class="num">${iso > D.ref ? 'sin datos' : fmt(c)}</b></span>`).join('');
  const w = $('#rwarn');
  const next = new Date((day(D.ref)+1)*864e5).toISOString().slice(0,10);
  w.innerHTML = (D.r1 > D.ref ? `<b>El informe de Microsoft llega hasta el ${dt(D.ref)}; no trae datos desde el ${dt(next)}.</b> Un profesor que solo se conectó esos días aparece en «No se conectaron». ` : '')
    + `Las cifras de reuniones, horas y mensajes son el acumulado de ${D.days} días de cada profesor, no solo de este rango.`;
}

function renderCrumbs(F){
  const extra = [S.rng!=='' ? `${RNG[S.rng].lab.toLowerCase()} ${rangoTxt}` : '', S.lvl!=='' ? `nivel ${LVk[+S.lvl].name.toLowerCase()}` : '', S.q ? `búsqueda «${esc($('#fQ').value.trim())}»` : ''].filter(Boolean);
  $('#crumbs').innerHTML = `<span>Estás viendo:</span><span class="cur">${extra.length ? extra.join(' · ') : 'Todos los profesores'}</span> <span class="sep">·</span> <span>${fmt(F.length)} profesores</span>`;
}

function render(){
  const F = filtered(false);
  renderRange();
  renderCrumbs(F);
  renderKPI(F);
  TM.set(F);
  const si = F.filter(t=>t.inR).length;
  $('#sDet').textContent = `${fmt(si)} usaron Teams y ${fmt(F.length-si)} no lo usaron ${rangoTxt}. Primero aparecen los que lo usaron; puedes cambiar el orden.`;
  $('#sAcc').innerHTML = `<b>Reuniones, horas, mensajes, canales y llamadas son el acumulado de ${D.days} días</b> (${dt(D.ini)} al ${dt(D.ref)}), no solo del ${rangoTxt.replace(/^del /,'')}. Las horas conectado son el tiempo con audio en reuniones y llamadas.`;
}
render();
</script>
